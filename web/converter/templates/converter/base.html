<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DISTO do DXF{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #1b1f23; }
  h1 { font-size: 1.5rem; }
  fieldset { border: 1px solid #c8ccd0; border-radius: 6px; margin: 1rem 0; padding: .75rem 1rem; }
  legend { font-weight: 600; }
  label { display: block; margin: .25rem 0; }
  .field { margin: .75rem 0; }
  .errorlist { color: #a40000; list-style: none; padding: 0; margin: .25rem 0; }
  .notice { padding: .75rem 1rem; border-radius: 6px; background: #e8f3ea; border: 1px solid #9bc7a5; }
  .warn { background: #fff6e0; border-color: #e0c070; }
  .fail { background: #fdeaea; border-color: #d99; }
  button, .button { background: #1f5fbf; color: #fff; border: 0; padding: .5rem 1rem; border-radius: 6px; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; }
  .secondary { background: #4a5560; }
  ul.files { padding-left: 1.2rem; }
  small { color: #55606b; }
  input[type=number] { width: 8rem; }
  .drop { border: 2px dashed #8a949e; border-radius: 6px; padding: 1.25rem; text-align: center; margin: .5rem 0; }
  .drop.over { background: #e8f3ea; border-color: #1f5fbf; }
  .drop input { margin-top: .5rem; }
  ul.messages { margin: .25rem 0; }
  h2 { font-size: 1.15rem; margin-top: 1.5rem; }
  .small { font-size: .9rem; color: #55606b; }
</style>
</head>
<body>
<h1>{% block heading %}DISTO Plan do DXF{% endblock %}</h1>
{% block content %}{% endblock %}
</body>
</html>
