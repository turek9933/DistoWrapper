[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distocad"
version = "0.1.0"
description = "Konwersja plikow DISTO Plan (.cmi/.xml) do DXF"
requires-python = ">=3.10"
dependencies = ["ezdxf>=1.3", "defusedxml>=0.7"]

[project.scripts]
distocad = "distocad.cli:main"

[tool.setuptools]
packages = ["distocad"]
